name: Update Lab Index

on:
  push:
    branches:
      - main
    paths:
      - "labs/**"
      - "scripts/generate_lab_index.py"
      - ".github/workflows/update-lab-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lab-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate lab index
        run: python scripts/generate_lab_index.py

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- Lab-index.md; then
            echo "Lab-index.md is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Lab-index.md
          git commit -m "docs: update generated lab index"
          git push
